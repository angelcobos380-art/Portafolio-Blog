<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CMS Admin{% endblock %}</title>
  <style>
    :root { --bg:#0f1115; --panel:#181b22; --text:#e6e6e6; --muted:#9aa0ab; --accent:#6c8cff; --border:#2a2f3a; --danger:#ff6b6b; --ok:#3ecf8e; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); }
    a { color: var(--accent); text-decoration:none; }
    nav { display:flex; gap:1rem; padding:0.75rem 1.5rem; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
    nav a { font-weight:600; }
    nav a.right { margin-left:auto; }
    main { padding:1.5rem; max-width:1100px; margin:0 auto; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:1.25rem; margin-bottom:1.25rem; }
    h1 { margin-top:0; font-size:1.5rem; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:0.5rem 0.6rem; border-bottom:1px solid var(--border); vertical-align:top; }
    th { color:var(--muted); font-size:0.8rem; text-transform:uppercase; letter-spacing:.03em; }
    .badge { display:inline-block; padding:0.1rem 0.5rem; border-radius:999px; font-size:0.75rem; background:var(--border); }
    .badge.PUBLICADO { background:rgba(62,207,142,.15); color:var(--ok); }
    .badge.BORRADOR { background:rgba(108,140,255,.15); color:var(--accent); }
    form.inline { display:inline; }
    button, .btn { display:inline-block; background:var(--accent); color:#0b0d12; border:none; padding:0.4rem 0.8rem; border-radius:6px; cursor:pointer; font-weight:600; font-size:0.85rem; }
    button.ghost, .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
    button.danger { background:var(--danger); }
    input, textarea, select { width:100%; padding:0.5rem; background:#0b0d12; color:var(--text); border:1px solid var(--border); border-radius:6px; font-family:inherit; }
    input[type=checkbox] { width:auto; }
    label { display:block; margin:0.75rem 0 0.3rem; color:var(--muted); font-size:0.85rem; }
    label.inline { display:inline; }
    .error { color:var(--danger); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:1rem; }
    .stat { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:1rem; }
    .stat strong { font-size:1.75rem; }
    .stat span { color:var(--muted); }
    .row { display:flex; align-items:center; justify-content:space-between; gap:1rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/admin/">Dashboard</a>
    <a href="/admin/posts">Posts</a>
    <a href="/admin/projects">Proyectos</a>
    <a href="/admin/categories">Categorías</a>
    <a href="/admin/metrics">Métricas</a>
    <a class="right" href="/admin/logout">Salir</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
