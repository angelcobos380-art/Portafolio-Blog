<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — CMS Admin</title>
  <style>
    :root { --bg:#0f1115; --panel:#181b22; --text:#e6e6e6; --muted:#9aa0ab; --accent:#6c8cff; --border:#2a2f3a; --danger:#ff6b6b; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); }
    .card { width:min(360px, 92vw); background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:2rem; }
    h1 { margin-top:0; font-size:1.4rem; }
    label { display:block; margin:1rem 0 0.3rem; color:var(--muted); font-size:0.85rem; }
    input { width:100%; padding:0.55rem; background:#0b0d12; color:var(--text); border:1px solid var(--border); border-radius:6px; }
    button { width:100%; margin-top:1.25rem; background:var(--accent); color:#0b0d12; border:none; padding:0.6rem; border-radius:6px; cursor:pointer; font-weight:600; }
    .error { color:var(--danger); }
  </style>
</head>
<body>
  <div class="card">
    <h1>CMS Admin</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/login">
      <label>Email</label>
      <input type="email" name="email" required autofocus>
      <label>Contraseña</label>
      <input type="password" name="password" required>
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
