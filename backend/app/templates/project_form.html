{% extends "base.html" %}
{% block title %}Proyecto — CMS Admin{% endblock %}
{% block content %}
<h1>{{ 'Editar proyecto' if form.get('project_id') else 'Nuevo proyecto' }}</h1>
<div class="panel">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ action }}">
    <label>Título</label>
    <input type="text" name="title" value="{{ form.get('title','') }}" required>
    <label>Descripción (Markdown)</label>
    <textarea name="description" rows="8" required>{{ form.get('description','') }}</textarea>
    <label>URL demo</label>
    <input type="url" name="demo_url" value="{{ form.get('demo_url','') }}">
    <label>URL imagen de portada</label>
    <input type="url" name="cover_image_url" value="{{ form.get('cover_image_url','') }}">
    <label>Stack (separado por coma)</label>
    <input type="text" name="stack" value="{{ form.get('stack','') }}">
    <label class="inline"><input type="checkbox" name="is_featured" value="true" {% if form.get('is_featured') %}checked{% endif %}> Destacado</label>
    <label>Orden</label>
    <input type="number" name="sort_order" value="{{ form.get('sort_order', 0) }}">
    <div style="margin-top:1rem">
      <button type="submit">Guardar</button>
      <a class="btn ghost" href="/admin/projects">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
