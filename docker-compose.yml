services:
  cms:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Se requiere SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Se requiere ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Se requiere ADMIN_PASSWORD}
      DATABASE_URL: sqlite:////data/cms.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:4321}
      REBUILD_WEBHOOK_URL: ${REBUILD_WEBHOOK_URL:-}
      VERCEL_DEPLOY_HOOK: ${VERCEL_DEPLOY_HOOK:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      MEDIA_LOCAL_DIR: /data/uploads
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:8000/media}
    volumes:
      - cms-data:/data

volumes:
  cms-data:
