services:
  - type: web
    name: cms-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        value: sqlite:////var/data/cms.db
      - key: COOKIE_SECURE
        value: "true"
      - key: VERCEL_DEPLOY_HOOK
        sync: false
    disk:
      name: cms-data
      mountPath: /var/data
      sizeGB: 1
